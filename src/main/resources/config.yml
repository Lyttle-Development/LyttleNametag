# ###################################################
#            Lyttle Nametag - config.yml            #
# ###################################################
# This file contains the configuration for the Lyttle Nametag plugin.
# You can customize the nametag format and other settings.
#
# ⚠️ Do NOT remove any keys — the plugin depends on them.
# You are free to customize the text and formatting.
# ###################################################

# nametag
nametag: |-
  <gray>%luckperms_prefix%</gray>
  <gray><PLAYER></gray>
  <dark_gray>@</dark_gray>
  <yellow>%vault_eco_balance_formatted%</yellow> <gold>Tokens</gold>
  <red>🖤 %math_0:0_({player_health})%<dark_grey>/20

# Interval in seconds for checking updates.
interval: 0.5

# The maximum distance at which the nametag will be visible. (In blocks) (default: 64)
view_distance: 64

# Render nametags through blocks.
see_through_blocks: true

# Hide the nametag while its owner is sneaking (holding Shift).
hide_when_sneaking: true

# Opacity percentages from 0 (transparent) to 100 (opaque).
text_opacity: 100
background_opacity: 0

# ⚠️ Do not change this value.
config_version: 4
